<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR SPORT SHOP - Novedades</title>
    
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    
    <link rel="stylesheet" href="../css/styles-v2.css">
    <link rel="stylesheet" href="../css/buscador.css">
    <link rel="stylesheet" href="../css/zapatos.css">
    
    <style>
        /* ===== ESTILOS ESPECÍFICOS DE NOVEDADES ===== */
        
        /* Etiqueta de promoción (Nuevo/Oferta) */
        .promo-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 5;
            animation: pulsePromo 2s infinite;
        }

        .promo-tag.nuevo {
            background: #2ecc71;
            color: #fff;
        }

        .promo-tag.oferta {
            background: #e74c3c;
            color: #fff;
        }

        @keyframes pulsePromo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Loading spinner */
        .loading-spinner {
            grid-column: 1/-1;
            text-align: center;
            padding: 80px 20px;
        }

        .loading-spinner i {
            font-size: 48px;
            color: #00d4ff;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Loading indicator (cargar más) */
        .loading-indicator {
            grid-column: 1/-1;
            text-align: center;
            padding: 30px 0;
        }

        .loading-indicator i {
            font-size: 32px;
            color: #00d4ff;
            animation: spin 1s linear infinite;
        }

        @media (max-width: 480px) {
            .promo-tag {
                font-size: 9px;
                padding: 3px 10px;
            }
        }
    </style>
</head>
<body class="novedades">

    <!-- HEADER COMPARTIDO -->
    <div id="header-container"></div>

    <!-- ENCABEZADO -->
    <section class="section-header">
        <div class="container">
            <h1><span>Novedades</span></h1>
            <p>Los últimos lanzamientos y promociones.</p>
        </div>
    </section>

    <!-- PRODUCTOS NOVEDADES -->
    <div class="container">
        <div class="product-grid-catalog" id="productGrid">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <p style="margin-top:20px;color:var(--text-secondary);">Cargando novedades...</p>
            </div>
        </div>
    </div>

    <!-- CONTACTO -->
    <section class="contacto">
        <div class="container">
            <div class="social-icons"></div>
        </div>
    </section>

    <!-- MODAL -->
    <div class="modal" id="shoeModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-body">
                <div class="modal-image"><i class="fas fa-shoe-prints"></i></div>
                <div class="modal-details">
                    <h3 id="modalTitle">Zapato</h3>
                    <p id="modalDescription">Descripción detallada</p>
                    <p class="modal-price" id="modalPrice">$0</p>
                    <button class="btn-comprar"><i class="fas fa-shopping-bag"></i> Agregar al carrito</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; JR SPORT SHOP - Jehovan Rincón</p>
        </div>
    </footer>

    <script>
        // ============================================================
        // ===== CARGAR PRODUCTOS DESDE JSON =====
        // ============================================================
        let productosData = [];

        async function cargarProductos() {
            try {
                console.log('📂 Cargando zapatos.json...');
                const response = await fetch('/tienda_zapatos/data/zapatos.json?v=' + Date.now());
                
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('✅ Datos cargados:', data);
                
                if (data && data.productos && Array.isArray(data.productos)) {
                    productosData = data.productos;
                    console.log(`✅ ${productosData.length} productos cargados`);
                } else {
                    console.error('❌ Estructura de JSON incorrecta');
                    productosData = [];
                }
                
                return productosData;
            } catch (error) {
                console.error('❌ Error al cargar productos:', error);
                productosData = [];
                return [];
            }
        }

        // ============================================================
        // ===== VARIABLES DE PAGINACIÓN =====
        // ============================================================
        let productosCargados = 0;
        const PRODUCTOS_POR_PAGINA = 20;
        let todosLosNovedades = [];
        let isLoading = false;

        // ============================================================
        // ===== FILTRAR NOVEDADES =====
        // ============================================================
        function filtrarNovedades() {
            let novedades = productosData.filter(producto => {
                const badge = producto.badge || producto.etiqueta || '';
                const descripcion = producto.descripcion || '';
                const nombre = producto.nombre || '';
                
                const esNuevo = badge.toLowerCase().includes('nuevo') || 
                               nombre.toLowerCase().includes('nuevo') ||
                               descripcion.toLowerCase().includes('nuevo lanzamiento');
                
                const esOferta = badge.toLowerCase().includes('oferta') || 
                                badge.toLowerCase().includes('descuento') ||
                                badge.toLowerCase().includes('promoción');
                
                return esNuevo || esOferta;
            });
            
            novedades.sort((a, b) => {
                const numA = parseInt(a.numero) || 0;
                const numB = parseInt(b.numero) || 0;
                return numB - numA;
            });
            
            return novedades;
        }

        // ============================================================
        // ===== CREAR CARD DE PRODUCTO =====
        // ============================================================
        function crearCardProducto(producto) {
            const card = document.createElement('a');
            card.href = `detalle_zapatos.html?nombre=${encodeURIComponent(producto.nombre)}`;
            card.className = 'product-card-link';
            
            const mainImage = producto.imagenes && producto.imagenes.length > 0 
                ? producto.imagenes[0] 
                : '';
            
            const badge = producto.badge || producto.etiqueta || '';
            let tipoPromo = 'nuevo';
            let textoPromo = 'Nuevo';
            
            if (badge.toLowerCase().includes('oferta') || 
                badge.toLowerCase().includes('descuento') ||
                badge.toLowerCase().includes('promoción')) {
                tipoPromo = 'oferta';
                textoPromo = '🔥 Oferta';
            }

            let qualityTag = producto.categoria || 'Novedad';
            let qualityClass = '';
            if (producto.categoria === 'Top Quality') {
                qualityClass = '⭐ Top Quality';
            } else if (producto.categoria === 'Triple A') {
                qualityClass = '🔝 Triple A';
            }

            card.innerHTML = `
                <div class="product-card-box">
                    <div class="product-img-container">
                        <img src="${mainImage}" alt="${producto.nombre}" class="product-img-catalog" loading="lazy" decoding="async" onerror="this.src='https://via.placeholder.com/300/333/666?text=No+Image'">
                        <span class="promo-tag ${tipoPromo}">${textoPromo}</span>
                    </div>
                    <div class="product-info-box">
                        <span class="product-brand-tag">${qualityClass || qualityTag}</span>
                        <h3 class="product-name">${producto.nombre}</h3>
                        <div class="product-footer-row">
                            <span class="product-price">${producto.precio || '$0.00'}</span>
                            <span class="product-detail-badge">Ver detalles</span>
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        // ============================================================
        // ===== RENDERIZAR CON PAGINACIÓN =====
        // ============================================================
        function renderNovedades() {
            const container = document.getElementById('productGrid');
            container.innerHTML = '';

            todosLosNovedades = filtrarNovedades();

            if (todosLosNovedades.length === 0) {
                container.innerHTML = `
                    <div class="no-products">
                        <i class="fas fa-box-open"></i>
                        <h3>No hay novedades disponibles</h3>
                        <p>Pronto tendremos nuevos lanzamientos y promociones</p>
                        <a href="/tienda_zapatos/index.html" style="display:inline-block;margin-top:20px;color:#00d4ff;text-decoration:none;border:1px solid #00d4ff;padding:10px 30px;border-radius:30px;transition:0.3s;" onmouseover="this.style.background='#00d4ff';this.style.color='#000';" onmouseout="this.style.background='transparent';this.style.color='#00d4ff';">Volver al inicio</a>
                    </div>
                `;
                return;
            }

            const iniciales = todosLosNovedades.slice(0, PRODUCTOS_POR_PAGINA);
            productosCargados = iniciales.length;
            
            iniciales.forEach(producto => {
                container.appendChild(crearCardProducto(producto));
            });
        }

        // ============================================================
        // ===== CARGAR MÁS NOVEDADES =====
        // ============================================================
        window.cargarMasNovedades = function() {
            if (isLoading || productosCargados >= todosLosNovedades.length) return;
            
            const container = document.getElementById('productGrid');
            
            let spinner = container.querySelector('.loading-indicator');
            if (!spinner) {
                spinner = document.createElement('div');
                spinner.className = 'loading-indicator';
                spinner.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cargando más novedades...';
                container.appendChild(spinner);
            }

            const siguienteLote = todosLosNovedades.slice(productosCargados, productosCargados + PRODUCTOS_POR_PAGINA);
            
            setTimeout(() => {
                siguienteLote.forEach(producto => {
                    container.appendChild(crearCardProducto(producto));
                });
                
                productosCargados += siguienteLote.length;
                
                const spinnerEl = container.querySelector('.loading-indicator');
                if (spinnerEl) spinnerEl.remove();
                
                isLoading = false;
            }, 300);
        };

        // ============================================================
        // ===== INFINITE SCROLL =====
        // ============================================================
        window.addEventListener('scroll', function() {
            if (isLoading || productosCargados >= todosLosNovedades.length || todosLosNovedades.length === 0) return;
            
            const scrollPosition = window.scrollY + window.innerHeight;
            const pageHeight = document.documentElement.scrollHeight;
            
            if (scrollPosition >= pageHeight - 300) {
                isLoading = true;
                cargarMasNovedades();
            }
        });

        // ============================================================
        // ===== INICIALIZAR =====
        // ============================================================
        async function init() {
            await cargarProductos();
            renderNovedades();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
    <script src="/tienda_zapatos/js/buscador.js"></script>
    <script src="/tienda_zapatos/components/header.js"></script>
</body>
</html>
