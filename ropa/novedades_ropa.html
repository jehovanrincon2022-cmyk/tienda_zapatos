<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR SPORT SHOP - Novedades Ropa</title>
    
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    
    <link rel="stylesheet" href="../css/styles-v2.css">
    <link rel="stylesheet" href="../css/buscador.css">
    <link rel="stylesheet" href="../css/ropa.css">
    
    <style>
        /* ===== ESTILOS ESPECÍFICOS DE NOVEDADES ROPA ===== */
        
        .promo-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 5;
            animation: pulsePromo 2s infinite;
        }

        .promo-tag.nuevo {
            background: #2ecc71;
            color: #fff;
        }

        .promo-tag.oferta {
            background: #e74c3c;
            color: #fff;
        }

        @keyframes pulsePromo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .loading-spinner {
            grid-column: 1/-1;
            text-align: center;
            padding: 80px 20px;
        }

        .loading-spinner i {
            font-size: 48px;
            color: var(--ropa-accent, #00CED1);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .promo-tag {
                font-size: 9px;
                padding: 3px 10px;
            }
        }
    </style>
</head>
<body class="novedades-ropa">

    <!-- HEADER COMPARTIDO -->
    <div id="header-container"></div>

    <!-- ENCABEZADO -->
    <section class="section-header">
        <div class="container">
            <div class="quality-badge">
                
                <span>LOS MEJORES PRECIOS</span>
            </div>
            <h1><span>Novedades Ropa</span></h1>
            <p>Lo último en moda y las mejores ofertas.</p>
        </div>
    </section>

    <!-- PRODUCTOS NOVEDADES ROPA -->
    <div class="container">
        <div class="product-grid-catalog" id="productGrid">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <p style="margin-top:20px;color:var(--text-secondary);">Cargando novedades...</p>
            </div>
        </div>
    </div>

    <!-- CONTACTO -->
    <section class="contacto">
        <div class="container">
            <div class="social-icons"></div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; JR SPORT SHOP - Jehovan Rincón</p>
        </div>
    </footer>

    <script>
        // ============================================================
        // ===== CARGAR PRODUCTOS DESDE ROPA.JSON =====
        // ============================================================
        let productosData = [];

        async function cargarProductos() {
            try {
                console.log('📂 Cargando ropa.json...');
                const response = await fetch('/tienda_zapatos/data/ropa.json?v=' + Date.now());
                
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('✅ Datos cargados:', data);
                
                if (data && data.productos && Array.isArray(data.productos)) {
                    productosData = data.productos;
                    console.log(`✅ ${productosData.length} productos de ropa cargados`);
                } else {
                    console.error('❌ Estructura de JSON incorrecta');
                    productosData = [];
                }
                
                return productosData;
            } catch (error) {
                console.error('❌ Error al cargar productos:', error);
                productosData = [];
                return [];
            }
        }

        // ============================================================
        // ===== FILTRAR NOVEDADES =====
        // ============================================================
        function filtrarNovedades() {
            let novedades = productosData.filter(producto => {
                const badge = producto.badge || producto.etiqueta || '';
                const descripcion = producto.descripcion || '';
                const nombre = producto.nombre || '';
                
                const esNuevo = badge.toLowerCase().includes('nuevo') || 
                               nombre.toLowerCase().includes('nuevo') ||
                               descripcion.toLowerCase().includes('nuevo lanzamiento');
                
                const esOferta = badge.toLowerCase().includes('oferta') || 
                                badge.toLowerCase().includes('descuento') ||
                                badge.toLowerCase().includes('promoción');
                
                return esNuevo || esOferta;
            });
            
            novedades.sort((a, b) => {
                const numA = parseInt(a.numero) || 0;
                const numB = parseInt(b.numero) || 0;
                return numB - numA;
            });
            
            return novedades;
        }

        // ============================================================
        // ===== CREAR CARD DE PRODUCTO (CON ORIGEN) =====
        // ============================================================
        function crearCardProducto(producto) {
            const card = document.createElement('a');
            // ⭐ AÑADIDO: &origen=novedades_ropa.html
            card.href = `detalle_ropa.html?nombre=${encodeURIComponent(producto.nombre)}&origen=novedades_ropa.html`;
            card.className = 'product-card-link';
            
            const mainImage = producto.imagenes && producto.imagenes.length > 0 
                ? producto.imagenes[0] 
                : '';
            
            const badge = producto.badge || producto.etiqueta || '';
            let tipoPromo = 'nuevo';
            let textoPromo = 'Nuevo';
            
            if (badge.toLowerCase().includes('oferta') || 
                badge.toLowerCase().includes('descuento') ||
                badge.toLowerCase().includes('promoción')) {
                tipoPromo = 'oferta';
                textoPromo = '🔥 Oferta';
            }

            const categoria = producto.categoria || 'Ropa';

            card.innerHTML = `
                <div class="product-card-box">
                    <div class="product-img-container">
                        <img src="${mainImage}" alt="${producto.nombre}" class="product-img-catalog" loading="lazy" decoding="async" onerror="this.src='https://via.placeholder.com/300/333/666?text=No+Image'">
                        <span class="promo-tag ${tipoPromo}">${textoPromo}</span>
                    </div>
                    <div class="product-info-box">
                        <span class="product-brand-tag">${categoria}</span>
                        <h3 class="product-name">${producto.nombre}</h3>
                        <div class="product-footer-row">
                            <span class="product-price">${producto.precio || '$0.00'}</span>
                            <span class="product-detail-badge">Ver detalles</span>
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        // ============================================================
        // ===== RENDERIZAR =====
        // ============================================================
        function renderNovedades() {
            const container = document.getElementById('productGrid');
            container.innerHTML = '';

            const novedades = filtrarNovedades();

            if (novedades.length === 0) {
                container.innerHTML = `
                    <div class="no-products">
                        <i class="fas fa-box-open"></i>
                        <h3>No hay novedades disponibles</h3>
                        <p>Pronto tendremos nuevos lanzamientos y promociones</p>
                        <a href="/tienda_zapatos/ropa/ropa.html" style="display:inline-block;margin-top:20px;color:#00CED1;text-decoration:none;border:1px solid #00CED1;padding:10px 30px;border-radius:30px;transition:0.3s;">Volver a Ropa</a>
                    </div>
                `;
                return;
            }

            novedades.forEach(producto => {
                container.appendChild(crearCardProducto(producto));
            });

            console.log(`✅ ${novedades.length} novedades de ropa mostradas`);
        }

        // ============================================================
        // ===== INICIALIZAR =====
        // ============================================================
        async function init() {
            await cargarProductos();
            renderNovedades();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
    <script src="/tienda_zapatos/js/buscador.js"></script>
    <script src="/tienda_zapatos/components/header.js"></script>
</body>
</html>
