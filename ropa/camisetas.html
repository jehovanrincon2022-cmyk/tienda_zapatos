<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camisetas - JR SPORT SHOP</title>
    <link rel="stylesheet" href="../css/styles-v2.css">
    <link rel="stylesheet" href="../css/buscador.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .section-header {
            background: linear-gradient(135deg, #0a0a1a, #1a1a2d);
            border-bottom: 3px solid var(--accent);
            padding: 40px 0 30px;
            text-align: center;
            margin-bottom: 40px;
        }
        .section-header h1 {
            font-size: 42px;
            font-weight: 300;
            letter-spacing: 6px;
            color: var(--text-primary);
            margin-bottom: 10px;
        }
        .section-header h1 span {
            color: var(--accent);
            font-weight: 400;
        }
        .section-header p {
            color: var(--text-secondary);
            font-size: 16px;
        }
        .product-grid-catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            padding: 20px 0 60px;
        }
        .product-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .product-card-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s ease;
            cursor: pointer;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .product-card-box:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: var(--shadow);
        }
        .product-img-container {
            width: 100%;
            padding-top: 100%;
            position: relative;
            overflow: hidden;
            background: var(--bg-secondary);
        }
        .product-img-catalog {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .product-card-box:hover .product-img-catalog {
            transform: scale(1.05);
        }
        .product-info-box {
            padding: 18px 20px 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .product-brand-tag {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 3px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 8px;
            width: fit-content;
        }
        .product-name {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            color: var(--text-primary);
            line-height: 1.3;
        }
        .product-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }
        .product-price {
            font-size: 22px;
            font-weight: 600;
            color: var(--accent);
        }
        .product-detail-badge {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .no-products {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }
        .no-products i {
            font-size: 64px;
            color: var(--accent);
            opacity: 0.4;
            margin-bottom: 20px;
            display: block;
        }
        .no-products h3 {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .no-products p {
            font-size: 14px;
            opacity: 0.7;
        }
        @media (max-width: 768px) {
            .section-header h1 {
                font-size: 28px;
                letter-spacing: 3px;
            }
            .product-grid-catalog {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 15px;
            }
            .product-info-box {
                padding: 12px 14px 16px;
            }
            .product-name {
                font-size: 13px;
            }
            .product-price {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div id="header-container"></div>
    </header>

    <!-- ENCABEZADO -->
    <section class="section-header">
        <div class="container">
            <h1>👕 <span>Camisetas</span></h1>
            <p>Camisetas de calidad premium</p>
        </div>
    </section>

    <!-- PRODUCTOS -->
    <div class="container">
        <div class="product-grid-catalog" id="productGrid">
            <!-- Los productos se cargarán desde ropa.json con JavaScript -->
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <p>&copy; JR SPORT SHOP - Jehovan Rincón</p>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script>
        // ====== CARGAR PRODUCTOS DE CAMISETAS DESDE ropa.json ======
        fetch('/tienda_zapatos/data/ropa.json?v=' + Date.now())
            .then(res => res.json())
            .then(data => {
                const productos = data.productos.filter(p => p.categoria === 'Camisetas');
                const grid = document.getElementById('productGrid');

                if (productos.length === 0) {
                    grid.innerHTML = `
                        <div class="no-products">
                            <i class="fas fa-tshirt"></i>
                            <h3>Próximamente</h3>
                            <p>Estamos preparando nuevos productos para ti</p>
                        </div>
                    `;
                    return;
                }

                productos.forEach(p => {
                    const card = document.createElement('a');
                    card.href = `detalle_ropa.html?nombre=${encodeURIComponent(p.nombre)}`;
                    card.className = 'product-card-link';
                    card.innerHTML = `
                        <div class="product-card-box">
                            <div class="product-img-container">
                                <img src="${p.imagenes[0]}" alt="${p.nombre}" class="product-img-catalog" onerror="this.src='https://via.placeholder.com/300/333/666?text=No+Image'">
                            </div>
                            <div class="product-info-box">
                                <span class="product-brand-tag">Camisetas</span>
                                <h3 class="product-name">${p.nombre}</h3>
                                <div class="product-footer-row">
                                    <span class="product-price">${p.precio}</span>
                                    <span class="product-detail-badge">Ver detalles →</span>
                                </div>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            })
            .catch(err => {
                console.error('Error cargando ropa.json:', err);
                document.getElementById('productGrid').innerHTML = `
                    <div class="no-products">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Error al cargar productos</h3>
                        <p>Intenta recargar la página</p>
                    </div>
                `;
            });
    </script>
    <script src="/tienda_zapatos/components/header.js"></script>
</body>
</html>
