<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👟 SoleStyle - Novedades</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== ESTILOS PARA LAS TARJETAS DE PRODUCTOS ===== */
        .product-grid-catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            padding: 20px 0 60px;
        }

        .product-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .product-card-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            height: 100%;
        }

        .product-card-box:hover {
            transform: translateY(-10px);
            border-color: #00d4ff;
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.15);
        }

        .product-img-container {
            width: 100%;
            padding-top: 100%;
            position: relative;
            overflow: hidden;
            background: var(--bg-secondary);
        }

        .product-img-catalog {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-card-box:hover .product-img-catalog {
            transform: scale(1.05);
        }

        .product-info-box {
            padding: 18px 20px 20px;
        }

        .product-brand-tag {
            display: inline-block;
            background: #00d4ff;
            color: #000;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 3px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            color: var(--text-primary);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }

        .product-price {
            font-size: 22px;
            font-weight: 600;
            color: #00d4ff;
        }

        .product-detail-badge {
            font-size: 12px;
            color: var(--text-secondary);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .product-detail-badge::after {
            content: '→';
            transition: transform 0.3s;
        }

        .product-card-box:hover .product-detail-badge::after {
            transform: translateX(5px);
        }

        /* ===== ETIQUETAS DE PROMOCIÓN Y NUEVO ===== */
        .promo-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 5;
            animation: pulsePromo 2s infinite;
        }

        .promo-tag.nuevo {
            background: #2ecc71;
            color: #fff;
        }

        .promo-tag.oferta {
            background: #e74c3c;
            color: #fff;
        }

        @keyframes pulsePromo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ===== ENCABEZADO ===== */
        .section-header {
            background: linear-gradient(135deg, #0a0a1a, #1a1a2d);
            border-bottom: 3px solid #00d4ff;
            padding: 10px 0 10px;
            margin-bottom: 30px;
        }

        .section-header h1 {
            font-size: 42px;
            font-weight: 300;
            letter-spacing: 4px;
            color: var(--text-primary);
        }

        .section-header h1 span {
            color: #00d4ff;
            font-weight: 400;
        }

        .section-header p {
            color: var(--text-secondary);
            font-size: 18px;
            margin-top: 10px;
            font-weight: 300;
        }

        /* ===== MENSAJE DE NO HAY PRODUCTOS ===== */
        .no-products {
            grid-column: 1/-1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .no-products i {
            font-size: 64px;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: block;
        }

        .no-products h3 {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 10px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .product-grid-catalog {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }
            
            .product-info-box {
                padding: 14px 15px 16px;
            }
            
            .product-name {
                font-size: 14px;
            }
            
            .product-price {
                font-size: 18px;
            }

            .section-header h1 {
                font-size: 32px;
            }
        }

        @media (max-width: 480px) {
            .product-grid-catalog {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            
            .product-info-box {
                padding: 10px 12px 14px;
            }
            
            .product-name {
                font-size: 12px;
            }
            
            .product-price {
                font-size: 16px;
            }
            
            .product-brand-tag {
                font-size: 8px;
                padding: 2px 10px;
            }
            
            .product-detail-badge {
                font-size: 10px;
            }

            .section-header h1 {
                font-size: 26px;
            }

            .promo-tag {
                font-size: 9px;
                padding: 3px 10px;
            }
        }
    </style>
</head>
<body>
    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="container">
          
            <div class="top-right">
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header>
        <div class="container">
            <div class="logo">
                <i class="fas fa-shoe-prints"></i>
                <span>SOLE<span>STYLE</span></span>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="novedades.html" class="active">Novedades</a></li>
                    <li><a href="Top_Quality.html">Top Quality</a></li>
                    <li><a href="Triple_A.html">Triple A</a></li>
                    <li><a href="doble_A.html">Doble A</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                
                <div class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></div>
                <div class="cart-icon"><i class="fas fa-shopping-bag"></i><span id="cart-count"></span></div>
                <div class="menu-toggle"><i class="fas fa-bars"></i></div>
            </div>
        </div>
    </header>

    <!-- ENCABEZADO -->
    <section class="section-header">
        <div class="container">
            <h1><span>Novedades</span></h1>
            <p>Los últimos lanzamientos y promociones.</p>
        </div>
    </section>

    <!-- PRODUCTOS NOVEDADES (FILTRADOS POR OFERTA Y NUEVO) -->
    <div class="container">
        <div class="product-grid-catalog" id="productGrid">
            <!-- Los productos se generan con JavaScript -->
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <p style="margin-top:20px;color:var(--text-secondary);">Cargando novedades...</p>
            </div>
        </div>
    </div>

    <!-- CONTACTO -->
    <section class="contacto">
        <div class="container">
            <div class="social-icons">
             
            </div>
        
        </div>
    </section>

    <!-- MODAL -->
    <div class="modal" id="shoeModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-body">
                <div class="modal-image"><i class="fas fa-shoe-prints"></i></div>
                <div class="modal-details">
                    <h3 id="modalTitle">Zapato</h3>
                    <p id="modalDescription">Descripción detallada</p>
                    <p class="modal-price" id="modalPrice">$0</p>
                    <button class="btn-comprar"><i class="fas fa-shopping-bag"></i> Agregar al carrito</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 SoleStyle - Jehovan Rincón</p>
        </div>
    </footer>

    <script>
        // ============================================================
        // ===== CARGAR PRODUCTOS DESDE JSON =====
        // ============================================================
        let productosData = [];

        async function cargarProductos() {
            try {
                console.log('📂 Cargando productos.json...');
                const response = await fetch('productos.json?v=' + Date.now());
                
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('✅ Datos cargados:', data);
                
                if (data && data.productos && Array.isArray(data.productos)) {
                    productosData = data.productos;
                    console.log(`✅ ${productosData.length} productos cargados`);
                } else {
                    console.error('❌ Estructura de JSON incorrecta');
                    productosData = [];
                }
                
                return productosData;
            } catch (error) {
                console.error('❌ Error al cargar productos:', error);
                productosData = [];
                return [];
            }
        }

        // ============================================================
        // ===== RENDERIZAR SOLO NOVEDADES (Oferta y Nuevo) =====
        // ============================================================
        function renderNovedades() {
            const container = document.getElementById('productGrid');
            container.innerHTML = '';

            // Filtrar productos que tengan "Nuevo" o "Oferta" en el badge
            const novedades = productosData.filter(producto => {
                // Buscar en el badge (puede estar en diferentes campos)
                const badge = producto.badge || producto.etiqueta || '';
                const descripcion = producto.descripcion || '';
                const nombre = producto.nombre || '';
                
                // Buscar palabras clave
                const esNuevo = badge.toLowerCase().includes('nuevo') || 
                               nombre.toLowerCase().includes('nuevo') ||
                               descripcion.toLowerCase().includes('nuevo lanzamiento');
                
                const esOferta = badge.toLowerCase().includes('oferta') || 
                                badge.toLowerCase().includes('descuento') ||
                                badge.toLowerCase().includes('promoción');
                
                return esNuevo || esOferta;
            });

            console.log(`🎯 Novedades encontradas: ${novedades.length}`);

            if (novedades.length === 0) {
                container.innerHTML = `
                    <div class="no-products">
                        <i class="fas fa-box-open"></i>
                        <h3>No hay novedades disponibles</h3>
                        <p>Pronto tendremos nuevos lanzamientos y promociones</p>
                        <a href="index.html" style="display:inline-block;margin-top:20px;color:#00d4ff;text-decoration:none;border:1px solid #00d4ff;padding:10px 30px;border-radius:30px;transition:0.3s;" onmouseover="this.style.background='#00d4ff';this.style.color='#000';" onmouseout="this.style.background='transparent';this.style.color='#00d4ff';">Volver al inicio</a>
                    </div>
                `;
                return;
            }

            novedades.forEach((producto, index) => {
                const card = document.createElement('a');
                card.href = `detalle.html?nombre=${encodeURIComponent(producto.nombre)}`;
                card.className = 'product-card-link';
                
                // Determinar si es Oferta o Nuevo para la etiqueta
                const badge = producto.badge || producto.etiqueta || '';
                let tipoPromo = 'nuevo';
                let textoPromo = 'Nuevo';
                
                if (badge.toLowerCase().includes('oferta') || 
                    badge.toLowerCase().includes('descuento') ||
                    badge.toLowerCase().includes('promoción')) {
                    tipoPromo = 'oferta';
                    textoPromo = '🔥 Oferta';
                }

                // Obtener la primera imagen
                const mainImage = producto.imagenes && producto.imagenes.length > 0 
                    ? producto.imagenes[0] 
                    : '';

                // Determinar la etiqueta de calidad (Top Quality o Triple A)
                let qualityTag = producto.categoria || 'Novedad';
                let qualityClass = '';
                if (producto.categoria === 'Top Quality') {
                    qualityClass = '⭐ Top Quality';
                } else if (producto.categoria === 'Triple A') {
                    qualityClass = '🔝 Triple A';
                }

                card.innerHTML = `
                    <div class="product-card-box">
                        <div class="product-img-container">
                            <img src="${mainImage}" alt="${producto.nombre}" class="product-img-catalog" onerror="this.src='https://via.placeholder.com/300/333/666?text=No+Image'">
                            <span class="promo-tag ${tipoPromo}">${textoPromo}</span>
                        </div>
                        <div class="product-info-box">
                            <span class="product-brand-tag">${qualityClass || qualityTag}</span>
                            <h3 class="product-name">${producto.nombre}</h3>
                            <div class="product-footer-row">
                                <span class="product-price">${producto.precio || '$0.00'}</span>
                                <span class="product-detail-badge">Ver detalles</span>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ====== TEMA CLARO/OSCURO ======
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        const savedTheme = localStorage.getItem('theme') || 'dark';
        body.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            const icon = themeToggle.querySelector('i');
            if (icon) {
                if (theme === 'dark') {
                    icon.className = 'fas fa-moon';
                } else {
                    icon.className = 'fas fa-sun';
                }
            }
        }

        // ====== MENÚ MÓVIL ======
        document.querySelector('.menu-toggle')?.addEventListener('click', () => {
            document.querySelector('.nav-links')?.classList.toggle('active');
        });

        // ====== CARRITO ======
        let cartCount = 0;
        document.getElementById('cart-count').textContent = cartCount;

        // ============================================================
        // ===== INICIALIZAR =====
        // ============================================================
        async function init() {
            await cargarProductos();
            renderNovedades();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
