<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR Sport Shop - Tienda de Zapatos</title>
    
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    
    <link rel="stylesheet" href="/tienda_zapatos/css/styles-v2.css">
    <link rel="stylesheet" href="/tienda_zapatos/css/buscador.css">
    
    <link rel="preload" as="image" href="/tienda_zapatos/zapatos/imagenes/image.jpg" fetchpriority="high">
</head>
<body>
    <!-- HEADER COMPARTIDO -->
    <div id="header-container"></div>

    <!-- HERO -->
    <section class="hero-banner" id="novedades">
        <div class="hero-background">
            <img src="/tienda_zapatos/zapatos/imagenes/image.jpg" 
                 alt="Zapatos" 
                 class="hero-bg-image"
                 fetchpriority="high">
            <div class="hero-overlay"></div>
        </div>
        
        <div class="container hero-content-wrapper">
            <div class="hero-content">
                <div class="hero-brand">
                    <span class="brand-line">JR</span>
                    <span class="brand-line highlight">SPORT SHOP</span>
                </div>
                <h1>NIKE</h1>
                <p class="subtitle">LO MEJOR EN CALZADO.</p>
            </div>
        </div>

        <div class="scroll-indicator">
            <span>DESCUBRE</span>
            <i class="fas fa-chevron-down"></i>
        </div>
    </section>

    <!-- VIDEO -->
    <section class="video-section" id="video">
        <div class="container">
            <div class="video-header">
                <h2>Nuestra <span>Colección en Movimiento</span></h2>
                <p>Descubre la elegancia y comodidad de nuestros zapatos</p>
            </div>
            
            <div class="video-container">
                <div class="video-wrapper">
                    <video loop autoplay muted playsinline loading="lazy">
                        <source src="/tienda_zapatos/videos/video2.mp4" type="video/mp4">
                    </video>
                </div>
            </div>
        </div>
    </section>

    <!-- CONTACTO -->
    <section class="contacto">
        <div class="container">
            <div class="social-icons"></div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; JR SPORT SHOP - Jehovan Rincón</p>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script src="/tienda_zapatos/components/header.js"></script>
    <script src="/tienda_zapatos/js/script.js?v=2"></script>
    <script src="/tienda_zapatos/js/buscador.js"></script>
</body>
</html>
