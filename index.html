<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👟 SoleStyle - Tienda de Zapatos</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="container">
            <span class="free-shipping"> Bienvenidos!.</span>
            <div class="top-right">
                <span class="weather">
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header>
        <div class="container">
            <div class="logo">
                <i class="fas fa-shoe-prints"></i>
                <span>SOLE<span>STYLE</span></span>
            </div>
            
            <nav>
                <ul class="nav-links">
                    <li><a href="novedades.html" class="active">Novedades</a></li>
                 
                    <li><a href="Top_Quality.html">Top Quality</a></li>
                    <li><a href="Triple_A.html">Triple A</a></li>
                </ul>
            </nav>

            <div class="header-actions">
                <div class="theme-toggle" id="themeToggle">
                    <i class="fas fa-moon"></i>
                </div>
                <div class="menu-toggle">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- ====== HERO CON IMAGEN PROTAGONISTA ====== -->
    <section class="hero-banner" id="novedades">
        <div class="hero-background">
            <img src="imagenes/image.jpg" 
            alt="Zapatos SoleStyle" 
            class="hero-bg-image">
            <div class="hero-overlay"></div>
        </div>
        
        <div class="container hero-content-wrapper">
            <div class="hero-content">
                <div class="hero-brand">
                    <span class="brand-line">SOLE</span>
                    <span class="brand-line highlight">STYLE</span>
                </div>
                <h1>NIKE</h1>
                <p class="subtitle">Sofisticación discreta.</p>
            </div>
        </div>

        <div class="scroll-indicator">
            <span>DESCUBRE</span>
            <i class="fas fa-chevron-down"></i>
        </div>
    </section>

    <!-- ====== VIDEO PUBLICITARIO (CON LOOP) ====== -->
    <section class="video-section" id="video">
        <div class="container">
            <div class="video-header">
                <h2>Nuestra <span>Colección en Movimiento</span></h2>
                <p>Descubre la elegancia y comodidad de nuestros zapatos</p>
            </div>
            
            <div class="video-container">
                <div class="video-wrapper">
                    <!-- 🔥 VIDEO EN BUCLE INFINITO CON LOOP 🔥 -->
                    <video loop autoplay muted playsinline>
                        <source src="videos/video2.mp4" type="video/mp4">
                        Tu navegador no soporta el video.
                    </video>
                </div>
            </div>
        </div>
    </section>

    <!-- CONTACTO / REDES -->
    <section class="contacto">
        <div class="container">
            <div class="social-icons">
                <!-- Tus iconos de redes sociales aquí -->
            </div>
        </div>
    </section>

    <!-- MODAL -->
    <div class="modal" id="shoeModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-body">
                <div class="modal-image">
                    <i class="fas fa-shoe-prints"></i>
                </div>
                <div class="modal-details">
                    <h3 id="modalTitle">Zapato</h3>
                    <p id="modalDescription">Descripción detallada</p>
                    <p class="modal-price" id="modalPrice">$0</p>
                    <button class="btn-comprar">
                        <i class="fas fa-shopping-bag"></i> Agregar al carrito
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; SoleStyle - Jehovan Rincón</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
