<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👟 SoleStyle - Top Quality</title>
    
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    
    <link rel="stylesheet" href="styles.css">
    <style>
        .product-grid-catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            padding: 20px 0 60px;
        }

        .product-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
            contain: layout style paint;
        }

        .product-card-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            height: 100%;
        }

        .product-card-box:hover {
            transform: translateY(-10px);
            border-color: #00d4ff;
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.15);
        }

        .product-img-container {
            width: 100%;
            padding-top: 100%;
            position: relative;
            overflow: hidden;
            background: var(--bg-secondary);
        }

        .product-img-catalog {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-card-box:hover .product-img-catalog {
            transform: scale(1.05);
        }

        .product-info-box {
            padding: 18px 20px 20px;
        }

        .product-brand-tag {
            display: inline-block;
            background: #00d4ff;
            color: #000;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 3px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            color: var(--text-primary);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }

        .product-price {
            font-size: 22px;
            font-weight: 600;
            color: #00d4ff;
        }

        .product-detail-badge {
            font-size: 12px;
            color: var(--text-secondary);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .product-detail-badge::after {
            content: '→';
            transition: transform 0.3s;
        }

        .product-card-box:hover .product-detail-badge::after {
            transform: translateX(5px);
        }

        .filter-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 28px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .filter-btn:hover {
            border-color: #00d4ff;
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: #00d4ff;
            border-color: #00d4ff;
            color: #000;
        }

        .section-header {
            background: linear-gradient(135deg, #0a0a1a, #1a1a2d);
            border-bottom: 3px solid #00d4ff;
            padding: 10px 0 10px;
            margin-bottom: 30px;
        }

        .quality-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 212, 255, 0.15);
            padding: 8px 10px;
            border-radius: 20px;
            margin-bottom: 5px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .quality-badge i {
            color: #00d4ff;
            font-size: 20px;
        }

        .quality-badge span {
            color: #00d4ff;
            font-size: 12px;
            letter-spacing: 3px;
            font-weight: 600;
        }

        .section-header h1 {
            font-size: 42px;
            font-weight: 300;
            letter-spacing: 4px;
            color: var(--text-primary);
        }

        .section-header h1 span {
            color: #00d4ff;
            font-weight: 400;
        }

        .section-header p {
            color: var(--text-secondary);
            font-size: 18px;
            margin-top: 10px;
            font-weight: 300;
        }

        .no-products {
            grid-column: 1/-1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .no-products i {
            font-size: 64px;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: block;
        }

        .no-products h3 {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 10px;
        }

        .loading-spinner {
            grid-column: 1/-1;
            text-align: center;
            padding: 80px 20px;
        }

        .loading-spinner i {
            font-size: 48px;
            color: #00d4ff;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .load-more-btn {
            grid-column: 1/-1;
            text-align: center;
            padding: 20px 0;
        }

        .load-more-btn button {
            padding: 14px 45px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .load-more-btn button:hover {
            background: var(--accent-hover);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(200, 168, 124, 0.3);
        }

        /* ===== INDICADOR DE CARGA (SPINNER) ===== */
        .loading-indicator {
            grid-column: 1/-1;
            text-align: center;
            padding: 30px 0;
        }

        .loading-indicator i {
            font-size: 32px;
            color: #00d4ff;
            animation: spin 1s linear infinite;
        }

        @media (max-width: 768px) {
            .product-grid-catalog {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }
            
            .product-info-box {
                padding: 14px 15px 16px;
            }
            
            .product-name {
                font-size: 14px;
            }
            
            .product-price {
                font-size: 18px;
            }

            .section-header h1 {
                font-size: 32px;
            }
            
            .product-card-box:hover {
                transform: none !important;
            }
            
            .product-card-box:hover .product-img-catalog {
                transform: none !important;
            }
        }

        @media (max-width: 480px) {
            .product-grid-catalog {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            
            .product-info-box {
                padding: 10px 12px 14px;
            }
            
            .product-name {
                font-size: 12px;
            }
            
            .product-price {
                font-size: 16px;
            }
            
            .product-brand-tag {
                font-size: 8px;
                padding: 2px 10px;
            }
            
            .product-detail-badge {
                font-size: 10px;
            }

            .section-header h1 {
                font-size: 26px;
            }

            .load-more-btn button {
                padding: 12px 30px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="container">
        </div>
    </div>

    <!-- HEADER -->
    <header>
        <div class="container">
            <div class="logo">
                <i class="fas fa-shoe-prints"></i>
                <span>SOLE<span>STYLE</span></span>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="novedades.html">Novedades</a></li>
                    <li><a href="Top_Quality.html" class="active">Top Quality</a></li>
                    <li><a href="Triple_A.html">Triple A</a></li>
                    <li><a href="doble_A.html">Doble A</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <div class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></div>
                <!-- ===== ÍCONO DEL CARRITO ELIMINADO ===== -->
                <div class="menu-toggle"><i class="fas fa-bars"></i></div>
            </div>
        </div>
    </header>

    <!-- ENCABEZADO ESPECIAL TOP QUALITY -->
    <section class="section-header">
        <div class="container">
            <div class="quality-badge">
                <i class="fas fa-crown"></i>
                <span>PREMIUM</span>
            </div>
            <h1>⭐ <span>Top Quality</span></h1>
            <p>Lo mejor de lo mejor. Calidad premium seleccionada</p>
        </div>
    </section>

    <!-- FILTROS -->
    <div class="container">
        <div class="filter-container">
            <button class="filter-btn active" onclick="filtrarPorMarca('todos')">Todos</button>
            <button class="filter-btn" onclick="filtrarPorMarca('nike')">Nike</button>
            <button class="filter-btn" onclick="filtrarPorMarca('adidas')">Adidas</button>
            <button class="filter-btn" onclick="filtrarPorMarca('jordan')">Jordan</button>
            <button class="filter-btn" onclick="filtrarPorMarca('newbalance')">New Balance</button>
            <button class="filter-btn" onclick="filtrarPorMarca('balenciaga')">Balenciaga</button>
            <button class="filter-btn" onclick="filtrarPorMarca('louis')">Louis Vuitton</button>
            <button class="filter-btn" onclick="filtrarPorMarca('other')">Otros</button>
        </div>
    </div>

    <!-- PRODUCTOS TOP QUALITY -->
    <div class="container">
        <div class="product-grid-catalog" id="productGrid">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <p style="margin-top:20px;color:var(--text-secondary);">Cargando productos Top Quality...</p>
            </div>
        </div>
    </div>

    <!-- CONTACTO -->
    <section class="contacto">
        <div class="container">
            <div class="social-icons"></div>
        </div>
    </section>

    <!-- MODAL -->
    <div class="modal" id="shoeModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-body">
                <div class="modal-image"><i class="fas fa-shoe-prints"></i></div>
                <div class="modal-details">
                    <h3 id="modalTitle">Zapato</h3>
                    <p id="modalDescription">Descripción detallada</p>
                    <p class="modal-price" id="modalPrice">$0</p>
                    <button class="btn-comprar"><i class="fas fa-shopping-bag"></i> Agregar al carrito</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 SoleStyle - Jehovan Rincón</p>
        </div>
    </footer>

    <script>
        // ============================================================
        // ===== CARGAR PRODUCTOS DESDE JSON =====
        // ============================================================
        let productosData = [];
        let productosFiltrados = [];
        let productosCargados = 0;
        const PRODUCTOS_POR_PAGINA = 20;
        let marcaActual = 'todos';
        let isLoading = false;

        async function cargarProductos() {
            try {
                console.log('📂 Cargando productos.json...');
                const response = await fetch('productos.json?v=' + Date.now());
                
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('✅ Datos cargados:', data);
                
                if (data && data.productos && Array.isArray(data.productos)) {
                    productosData = data.productos;
                    console.log(`✅ ${productosData.length} productos cargados`);
                } else {
                    console.error('❌ Estructura de JSON incorrecta');
                    productosData = [];
                }
                
                return productosData;
            } catch (error) {
                console.error('❌ Error al cargar productos:', error);
                productosData = [];
                return [];
            }
        }

        // ============================================================
        // ===== FILTRAR POR CATEGORÍA Y MARCA =====
        // ============================================================
        function filtrarProductos() {
            let resultado = productosData.filter(producto => 
                producto.categoria === 'Top Quality'
            );
            
            if (marcaActual !== 'todos') {
                resultado = resultado.filter(producto => {
                    const marcaProducto = (producto.marca || '').toLowerCase();
                    return marcaProducto === marcaActual;
                });
            }
            
            return resultado;
        }

        // ============================================================
        // ===== CREAR CARD DE PRODUCTO =====
        // ============================================================
        function crearCardProducto(producto) {
            const card = document.createElement('a');
            card.href = `detalle.html?nombre=${encodeURIComponent(producto.nombre)}`;
            card.className = 'product-card-link';
            card.dataset.brand = (producto.marca || '').toLowerCase();
            
            const mainImage = producto.imagenes && producto.imagenes.length > 0 
                ? producto.imagenes[0] 
                : '';

            card.innerHTML = `
                <div class="product-card-box">
                    <div class="product-img-container">
                        <img src="${mainImage}" alt="${producto.nombre}" class="product-img-catalog" loading="lazy" decoding="async" onerror="this.src='https://via.placeholder.com/300/333/666?text=No+Image'">
                    </div>
                    <div class="product-info-box">
                        <span class="product-brand-tag">⭐ Top Quality</span>
                        <h3 class="product-name">${producto.nombre}</h3>
                        <div class="product-footer-row">
                            <span class="product-price">${producto.precio || '$0.00'}</span>
                            <span class="product-detail-badge">Ver detalles</span>
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        // ============================================================
        // ===== RENDERIZAR CON PAGINACIÓN =====
        // ============================================================
        function renderProductos() {
            const container = document.getElementById('productGrid');
            container.innerHTML = '';

            productosFiltrados = filtrarProductos();

            if (productosFiltrados.length === 0) {
                container.innerHTML = `
                    <div class="no-products">
                        <i class="fas fa-box-open"></i>
                        <h3>No hay productos en esta categoría</h3>
                        <p>Pronto tendremos más novedades para ti</p>
                        <a href="index.html" style="display:inline-block;margin-top:20px;color:#00d4ff;text-decoration:none;border:1px solid #00d4ff;padding:10px 30px;border-radius:30px;transition:0.3s;" onmouseover="this.style.background='#00d4ff';this.style.color='#000';" onmouseout="this.style.background='transparent';this.style.color='#00d4ff';">Volver al inicio</a>
                    </div>
                `;
                return;
            }

            // Cargar solo los primeros 20
            const iniciales = productosFiltrados.slice(0, PRODUCTOS_POR_PAGINA);
            productosCargados = iniciales.length;
            
            iniciales.forEach(producto => {
                container.appendChild(crearCardProducto(producto));
            });

            // ===== BOTÓN "Cargar más" ELIMINADO =====
            // Ahora la carga es automática al hacer scroll
        }

        // ============================================================
        // ===== CARGAR MÁS PRODUCTOS (AUTOMÁTICO) =====
        // ============================================================
        window.cargarMasProductos = function() {
            const container = document.getElementById('productGrid');
            
            // Mostrar indicador de carga
            let spinner = container.querySelector('.loading-indicator');
            if (!spinner) {
                spinner = document.createElement('div');
                spinner.className = 'loading-indicator';
                spinner.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cargando más productos...';
                container.appendChild(spinner);
            }

            const siguienteLote = productosFiltrados.slice(productosCargados, productosCargados + PRODUCTOS_POR_PAGINA);
            
            // Eliminar spinner después de un pequeño retraso para que se vea
            setTimeout(() => {
                siguienteLote.forEach(producto => {
                    container.appendChild(crearCardProducto(producto));
                });
                
                productosCargados += siguienteLote.length;
                
                // Quitar spinner
                const spinnerEl = container.querySelector('.loading-indicator');
                if (spinnerEl) spinnerEl.remove();
                
                isLoading = false;
            }, 300);
        };

        // ============================================================
        // ===== CARGA AUTOMÁTICA AL HACER SCROLL (INFINITE SCROLL) =====
        // ============================================================
        window.addEventListener('scroll', function() {
            // Si ya está cargando o no hay más productos, salir
            if (isLoading || productosCargados >= productosFiltrados.length) return;
            
            // Calcular si el usuario llegó al final de la página
            const scrollPosition = window.scrollY + window.innerHeight;
            const pageHeight = document.documentElement.scrollHeight;
            
            // Si está a menos de 300px del final
            if (scrollPosition >= pageHeight - 300) {
                isLoading = true;
                cargarMasProductos();
            }
        });

        // ============================================================
        // ===== FILTRAR POR MARCA =====
        // ============================================================
        window.filtrarPorMarca = function(marca) {
            console.log('🔍 Filtrando por:', marca);
            marcaActual = marca;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                const btnText = btn.textContent.toLowerCase().trim();
                if (marca === 'todos' && btnText.includes('todos')) {
                    btn.classList.add('active');
                } else if (marca === 'nike' && btnText.includes('nike')) {
                    btn.classList.add('active');
                } else if (marca === 'adidas' && btnText.includes('adidas')) {
                    btn.classList.add('active');
                } else if (marca === 'jordan' && btnText.includes('jordan')) {
                    btn.classList.add('active');
                } else if (marca === 'newbalance' && btnText.includes('new balance')) {
                    btn.classList.add('active');
                } else if (marca === 'balenciaga' && btnText.includes('balenciaga')) {
                    btn.classList.add('active');
                } else if (marca === 'louis' && btnText.toLowerCase().includes('louis vuitton')) {
                    btn.classList.add('active');
                } else if (marca === 'other' && btnText.includes('otros')) {
                    btn.classList.add('active');
                }
            });
            
            productosCargados = 0;
            renderProductos();
        };

        // ====== TEMA CLARO/OSCURO ======
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        const savedTheme = localStorage.getItem('theme') || 'dark';
        body.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            const icon = themeToggle.querySelector('i');
            if (icon) {
                if (theme === 'dark') {
                    icon.className = 'fas fa-moon';
                } else {
                    icon.className = 'fas fa-sun';
                }
            }
        }

        // ====== MENÚ MÓVIL ======
        document.querySelector('.menu-toggle')?.addEventListener('click', () => {
            document.querySelector('.nav-links')?.classList.toggle('active');
        });

        // ====== CARRITO ELIMINADO ======
        // let cartCount = 0;
        // document.getElementById('cart-count').textContent = cartCount;

        // ====== SERVICE WORKER ======
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('✅ Service Worker registrado'))
                .catch(() => console.log('⚠️ Service Worker no disponible'));
        }

        // ============================================================
        // ===== INICIALIZAR =====
        // ============================================================
        async function init() {
            await cargarProductos();
            renderProductos();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
