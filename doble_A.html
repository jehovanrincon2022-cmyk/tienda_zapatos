<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👟 SoleStyle - Doble A</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== ESTILOS PARA LAS TARJETAS DE PRODUCTOS ===== */
        .product-grid-catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            padding: 20px 0 60px;
        }

        .product-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .product-card-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            height: 100%;
        }

        .product-card-box:hover {
            transform: translateY(-10px);
            border-color: #ff6b35;
            box-shadow: 0 10px 40px rgba(255, 107, 53, 0.15);
        }

        .product-img-container {
            width: 100%;
            padding-top: 100%;
            position: relative;
            overflow: hidden;
            background: var(--bg-secondary);
        }

        .product-img-catalog {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-card-box:hover .product-img-catalog {
            transform: scale(1.05);
        }

        .product-info-box {
            padding: 18px 20px 20px;
        }

        .product-brand-tag {
            display: inline-block;
            background: #ff6b35;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 3px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            color: var(--text-primary);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }

        .product-price {
            font-size: 22px;
            font-weight: 600;
            color: #ff6b35;
        }

        .product-detail-badge {
            font-size: 12px;
            color: var(--text-secondary);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .product-detail-badge::after {
            content: '→';
            transition: transform 0.3s;
        }

        .product-card-box:hover .product-detail-badge::after {
            transform: translateX(5px);
        }

        /* ===== ENCABEZADO DOBLE A ===== */
        .section-header {
            background: linear-gradient(135deg, #1a0a0a, #2d1a1a);
            border-bottom: 3px solid #ff6b35;
            padding: 10px 0 10px;
            margin-bottom: 30px;
        }

        .quality-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 107, 53, 0.15);
            padding: 8px 10px;
            border-radius: 20px;
            margin-bottom: 5px;
            border: 1px solid rgba(255, 107, 53, 0.2);
        }

        .quality-badge i {
            color: #ff6b35;
            font-size: 20px;
        }  

        .quality-badge span {
            color: #ff6b35;
            font-size: 12px;
            letter-spacing: 3px;
            font-weight: 600;
        }

        .section-header h1 {
            font-size: 42px;
            font-weight: 300;
            letter-spacing: 4px;
            color: var(--text-primary);
        }

        .section-header h1 span {
            color: #ff6b35;
            font-weight: 400;
        }

        .section-header p {
            color: var(--text-secondary);
            font-size: 18px;
            margin-top: 10px;
            font-weight: 300;
        }

        /* ===== MENSAJE DE SIN PRODUCTOS ===== */
        .no-products {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .no-products i {
            font-size: 64px;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: block;
        }

        .no-products h3 {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 10px;
        }

        .no-products p {
            font-size: 16px;
            opacity: 0.7;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .product-grid-catalog {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }
            
            .product-info-box {
                padding: 14px 15px 16px;
            }
            
            .product-name {
                font-size: 14px;
            }
            
            .product-price {
                font-size: 18px;
            }

            .section-header h1 {
                font-size: 32px;
            }
        }

        @media (max-width: 480px) {
            .product-grid-catalog {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            
            .product-info-box {
                padding: 10px 12px 14px;
            }
            
            .product-name {
                font-size: 12px;
            }
            
            .product-price {
                font-size: 16px;
            }
            
            .product-brand-tag {
                font-size: 8px;
                padding: 2px 10px;
            }
            
            .product-detail-badge {
                font-size: 10px;
            }

            .section-header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="container">
            <span class="free-shipping"><i class="fas fa-truck"></i> Bienvenidos!.</span>
            <div class="top-right">
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header>
        <div class="container">
            <div class="logo">
                <i class="fas fa-shoe-prints"></i>
                <span>SOLE<span>STYLE</span></span>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="novedades.html">Novedades</a></li>
                    <li><a href="Top_Quality.html">Top Quality</a></li>
                    <li><a href="Triple_A.html">Triple A</a></li>
                    <li><a href="Doble_A.html">Doble A</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <div class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></div>
                <div class="menu-toggle"><i class="fas fa-bars"></i></div>
            </div>
        </div>
    </header>

    <!-- ENCABEZADO ESPECIAL DOBLE A -->
    <section class="section-header">
        <div class="container">
            <div class="quality-badge">
                <i class="fas fa-tag"></i>
                <span>ECONÓMICO</span>
            </div>
            <h1>🟠 <span>Doble A</span></h1>
            <p>Calidad accesible. Estilo para todos</p>
        </div>
    </section>

    <!-- ===== PRODUCTOS DOBLE A ===== -->
    <div class="container">
        <div class="product-grid-catalog" id="productGrid">
                            <!-- Zambas -->
            <a href="detalle.html?nombre=Air%20Force%20One%20Blancas" class="product-card-link" data-brand="nike">
                <div class="product-card-box">
                    <div class="product-img-container">
                        <img src="imagenes/zamba.jpg" alt="Zamba" class="product-img-catalog" onerror="this.src='https://via.placeholder.com/300/333/666?text=No+Image'">
                    </div>
                    <div class="product-info-box">
                        <span class="product-brand-tag">Doble A</span>
                        <h3 class="product-name">Zamba</h3>
                        <div class="product-footer-row">
                            <span class="product-price">$30.00</span>
                            <span class="product-detail-badge">Ver detalles</span>
                        </div>
                    </div>
                </div>
            </a>
            
        </div>
    </div>



    <!-- CONTACTO -->
    <section class="contacto">
        <div class="container">
            <div class="social-icons">
                <a href="#" class="social-icon whatsapp"><i class="fab fa-whatsapp"></i></a>
                <a href="#" class="social-icon instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-icon telegram"><i class="fab fa-telegram"></i></a>
                <a href="#" class="social-icon facebook"><i class="fab fa-facebook"></i></a>
            </div>
        </div>
    </section>

    <!-- MODAL -->
    <div class="modal" id="shoeModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-body">
                <div class="modal-image"><i class="fas fa-shoe-prints"></i></div>
                <div class="modal-details">
                    <h3 id="modalTitle">Zapato</h3>
                    <p id="modalDescription">Descripción detallada</p>
                    <p class="modal-price" id="modalPrice">$0</p>
                    <button class="btn-comprar"><i class="fas fa-shopping-bag"></i> Agregar al carrito</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 SoleStyle - Jehovan Rincón</p>
        </div>
    </footer>

    <!-- ===== SCRIPT ===== -->
    <script>
        // ====== TEMA CLARO/OSCURO ======
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        const savedTheme = localStorage.getItem('theme') || 'dark';
        body.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            const icon = themeToggle.querySelector('i');
            if (icon) {
                if (theme === 'dark') {
                    icon.className = 'fas fa-moon';
                } else {
                    icon.className = 'fas fa-sun';
                }
            }
        }

        // ====== MENÚ MÓVIL ======
        document.querySelector('.menu-toggle')?.addEventListener('click', () => {
            document.querySelector('.nav-links')?.classList.toggle('active');
        });

        // ====== CARRITO ======
        let cartCount = 0;
        document.getElementById('cart-count').textContent = cartCount;

        // ============================================================
        // ===== CARGAR PRODUCTOS DESDE JSON (SOLO DOBLE A) =====
        // ============================================================
        async function cargarProductosDobleA() {
            try {
                const response = await fetch('productos.json?v=' + Date.now());
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }
                const data = await response.json();
                
                if (data && data.productos && Array.isArray(data.productos)) {
                    const container = document.getElementById('productGrid');
                    container.innerHTML = '';
                    
                    // Filtrar productos con categoría "Doble A"
                    const productosDobleA = data.productos.filter(p => 
                        p.categoria && p.categoria.toLowerCase() === 'doble a'
                    );
                    
                    if (productosDobleA.length === 0) {
                        container.innerHTML = `
                            <div class="no-products">
                                <i class="fas fa-box-open"></i>
                                <h3>Próximamente</h3>
                                <p>Estamos preparando nuestra colección Doble A</p>
                            </div>
                        `;
                        return;
                    }
                    
                    productosDobleA.forEach(producto => {
                        const card = document.createElement('a');
                        card.href = `detalle.html?nombre=${encodeURIComponent(producto.nombre)}`;
                        card.className = 'product-card-link';
                        
                        const mainImage = producto.imagenes && producto.imagenes.length > 0 
                            ? producto.imagenes[0] 
                            : '';
                        
                        card.innerHTML = `
                            <div class="product-card-box">
                                <div class="product-img-container">
                                    <img src="${mainImage}" alt="${producto.nombre}" class="product-img-catalog" onerror="this.src='https://via.placeholder.com/300/333/666?text=No+Image'">
                                </div>
                                <div class="product-info-box">
                                    <span class="product-brand-tag">Doble A</span>
                                    <h3 class="product-name">${producto.nombre}</h3>
                                    <div class="product-footer-row">
                                        <span class="product-price">${producto.precio || '$0.00'}</span>
                                        <span class="product-detail-badge">Ver detalles</span>
                                    </div>
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                }
            } catch (error) {
                console.error('Error al cargar productos:', error);
            }
        }

        // ====== INICIALIZAR ======
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', cargarProductosDobleA);
        } else {
            cargarProductosDobleA();
        }
    </script>
</body>
</html>
